<!doctype html><html lang="ja"><head><meta charset="utf-8"><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026-11-04-test</title><style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#0f172a;--sub:#64748b;--line:#e2e8f0;--acc:#4f46e5;--acc2:#0ea5e9;--s5:#10b981;--s4:#3b82f6;--s3:#f59e0b;--s0:#94a3b8}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#141a2e;--ink:#e6e9f5;--sub:#93a0bd;--line:#252d48}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 Inter,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 60px}
header{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;padding:34px 0 40px;margin-bottom:-18px}
header .wrap{padding-bottom:0}header small{opacity:.85;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
header h1{margin:4px 0 6px;font-size:28px;letter-spacing:-.01em}header p{margin:0;opacity:.9;font-size:13px}
header a{color:#fff}
.bar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 6px 24px rgba(15,23,42,.06);position:sticky;top:8px;z-index:5}
.bar input{flex:1;min-width:160px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px}
.chip,.btn{border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}.btn{border-radius:9px;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--s0);border-radius:12px;margin:12px 0;transition:box-shadow .2s}
.card.s5{border-left-color:var(--s5)}.card.s4{border-left-color:var(--s4)}.card.s3{border-left-color:var(--s3)}
.card:hover,.card[open]{box-shadow:0 8px 26px rgba(15,23,42,.08)}
summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:14px 16px}summary::-webkit-details-marker{display:none}
.badge{flex:none;width:28px;height:28px;border-radius:50%;background:var(--s0);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:2px}
.s5 .badge{background:var(--s5)}.s4 .badge{background:var(--s4)}.s3 .badge{background:var(--s3)}
.head{flex:1;min-width:0}.meta{font-size:11.5px;color:var(--sub)}.title{font-weight:650;line-height:1.4;margin:2px 0}.ja1{font-size:13.5px;color:var(--sub)}
.chev{color:var(--sub);transition:transform .2s;margin-top:4px}details[open] .chev{transform:rotate(180deg)}
.body{padding:2px 16px 16px 56px;border-top:1px dashed var(--line);margin:0 0 0 0}
.cols{display:grid;grid-template-columns:1fr;gap:12px;padding-top:12px}
@media(min-width:760px){.cols{grid-template-columns:1fr 1fr}}
.body h4{margin:0 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}.body p{margin:0;font-size:14px}
.foot{margin-top:12px;font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.foot a{color:var(--acc);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:2px 8px}
.tag{background:var(--bg);border-radius:999px;padding:1px 8px}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.issue{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.issue:hover{border-color:var(--acc)}.issue b{font-size:17px}.issue .n{float:right;color:var(--acc);font-weight:700}.issue ul{margin:6px 0 0;padding-left:18px;color:var(--sub);font-size:13px}
</style></head><body><header><div class="wrap"><small>Weekly Paper Digest</small><h1>2026-11-04-test</h1><p>注目 0 件 / スキャン 0 件（低関連 0 件除外） · <a href="https://ebs2cb.github.io/paper-alert/">バックナンバー</a></p></div></header><div class="wrap"><div class="bar"><input id="q" placeholder="検索 (タイトル・要約・タグ)"><button class="btn" id="tg">すべて展開</button></div><div class="empty">今週の該当論文はありませんでした</div></div><script>
const q=document.getElementById('q'),cards=[...document.querySelectorAll('.card')],chips=[...document.querySelectorAll('.chip')];
function f(){const s=q.value.toLowerCase(),on=chips.filter(c=>c.classList.contains('on')).map(c=>c.dataset.t);
cards.forEach(c=>{const okT=!on.length||on.some(t=>c.dataset.t.split('|').includes(t)),okQ=!s||c.dataset.q.includes(s);c.style.display=okT&&okQ?'':'none'})}
q.oninput=f;chips.forEach(c=>c.onclick=()=>{c.classList.toggle('on');f()});
let open=false;document.getElementById('tg').onclick=()=>{open=!open;cards.forEach(c=>c.open=open);document.getElementById('tg').textContent=open?'すべて閉じる':'すべて展開'};
</script></body></html>
